<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnchorWise - Receipt Splitter</title>
  <link rel="stylesheet" href="./style.css">
  
  <!-- Standalone Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
  <!-- jsPDF Bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>AnchorWise Receipt Splitter</h1>
      <p>Scan, highlight purchases per person, and share PDF totals.</p>
    </header>

    <main class="main-content">
      <!-- Upload / Camera Input Section -->
      <section class="upload-section" id="upload-section">
        <label for="receipt-input" class="upload-btn">
          📷 Upload or Scan Receipt
        </label>
        <input type="file" id="receipt-input" accept="image/*" capture="environment" hidden>
      </section>

      <!-- OCR Status Indicator -->
      <div id="ocr-status" class="status-bar hidden">Processing OCR...</div>

      <!-- Main Canvas Studio -->
      <section class="canvas-container hidden" id="studio-section">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <img id="receipt-img" alt="Scanned Receipt">
          <canvas id="highlight-canvas"></canvas>
        </div>

        <!-- Person Selector Bar -->
        <div class="person-selector" id="person-selector">
          <button class="person-btn active" data-id="1">
            <span class="color-dot" style="background: #00e5ff;"></span> Person 1
          </button>
          <button class="person-btn" data-id="2">
            <span class="color-dot" style="background: #ff0080;"></span> Person 2
          </button>
          <button class="person-btn" data-id="3">
            <span class="color-dot" style="background: #ffeb3b;"></span> Person 3
          </button>
          <button class="person-btn" data-id="4">
            <span class="color-dot" style="background: #9c27b0;"></span> Person 4
          </button>
          <button class="person-btn" data-id="5">
            <span class="color-dot" style="background: #4caf50;"></span> Person 5
          </button>
        </div>

        <!-- Person Totals Live Summary -->
        <div class="summary-card" id="summary-card">
          <h3>Calculated Totals</h3>
          <ul id="totals-list">
            <li>Person 1: <strong>$0.00</strong></li>
            <li>Person 2: <strong>$0.00</strong></li>
            <li>Person 3: <strong>$0.00</strong></li>
            <li>Person 4: <strong>$0.00</strong></li>
            <li>Person 5: <strong>$0.00</strong></li>
          </ul>
        </div>

        <!-- Action Controls -->
        <div class="action-bar">
          <button id="clear-btn" class="secondary-btn">Clear Highlights</button>
          <button id="export-pdf-btn" class="primary-btn">Save PDF & Share</button>
        </div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
