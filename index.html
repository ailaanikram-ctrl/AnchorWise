$('#pvc').onclick=()=>$('#pvw').classList.remove('on');
$('#pvd').onclick=async()=>{try{dl(await getPdf(R.pv));note('Downloaded.')}catch(e){note('PDF failed: '+e.message,1)}recRender()};
$('#pvs').onclick=async()=>{if(!gate()){$('#pvw').classList.remove('on');return recRender()}try{await sendR(R.pv)}catch(e){note('PDF failed: '+e.message,1)}recRender()};
async function act(p,m){R.note=null;if(!gate())return recRender();try{if(m=='pv')await previewR(p);else if(m=='dl'){dl(await getPdf(p));note('Downloaded '+R.pdfs[p].name)}else await sendR(p)}catch(e){note('PDF failed: '+e.message,1)}recRender()}
async function genAll(){R.note=null;if(!gate())return recRender();let n=0;try{for(let p=1;p<=5;p++)if(calc().per[p].lines.length||R.force[p]){await getPdf(p);n++}note(n?`Generated ${n} PDF${n>1?'s':''}. Download or send each one below.`:'No one has assigned items yet.',!n)}catch(e){note('PDF failed: '+e.message,1)}recRender()}
function unassign(k,p){const it=R.items[k];if(it.sp){it.sp=it.sp.filter(x=>x!=p);if(it.sp.length==1){it.p=it.sp[0];it.sp=null}else if(it.sp.length){it.md='eq';it.cv={}}else it.sp=null}else if(it.p==p)it.p=0;recRender()}
function recRender(){R.view='rec';const B=$('#sbody'),sc=B.scrollTop,k=chk(),c=k.c,asg=[1,2,3,4,5].reduce((a,p)=>a+c.per[p].amt,0),okSum=Math.abs(c.F-asg-c.un.amt)<.005;
let h=`<button id="bk" class="s" style="width:100%">← Highlight</button>${R.note?`<p class="${R.note.bad?'bad':'ok'}">${esc(R.note.msg)}</p>`:''}`;
if(R.warn)h+=`<div class="card" style="border-color:var(--warn)"><b class="bad">Items and tax do not match the receipt total (difference ${rm(k.ex)}). Please check the items marked ⚠, or continue if you are sure.</b><div class="bt" style="margin-top:8px"><button class="s" data-ca="1">Continue anyway</button></div></div>`;
h+=`<div class="card" style="margin-top:8px"><h3>Who pays what</h3><div class="row"><span class="g"><b>Me</b><br><small>${k.unI} item${k.unI==1?'':'s'} not highlighted count as mine</small></span><b>${rm(c.un.amt)}</b></div><div class="row"><span class="g">Other people</span><b>${rm(asg)}</b></div><div class="row"><span class="g">Receipt total (paid by me)</span><b>${rm(c.F)}</b></div>
<p class="${okSum?'ok':'bad'}" style="margin:6px 0 0">${okSum?'✓':'⚠'} ${rm(c.un.amt)} + ${rm(asg)} = ${rm(c.F)}</p><p class="${k.bad?'bad':'ok'}" style="margin:0">${k.bad?'⚠':'✓'} Difference still to resolve: ${rm(k.ex)}</p></div>`;
for(let p=1;p<=5;p++){const pp=c.per[p],has=pp.lines.length>0,o=R.pdfs[p],st=!o?'Not generated':o.sig==sig(p)?'PDF ready ✓':'Outdated · will regenerate';
h+=`<div class="card"><div class="row" style="border:0"><span class="dot" style="background:${NEON[p-1]}">${p}</span><input data-nm="${p}" value="${esc(nameOf(p))}" style="flex:1"></div>`;
h+=has||R.force[p]?`<p style="margin:0">Amount to Pay Back: <b style="font-size:22px;color:var(--g)">${rm(pp.amt)}</b></p><small>${st}</small>`:`<p class="m" style="margin:0">No items assigned</p>`;
h+=pp.lines.map(l=>`<div class="row"><span class="g"><b>${esc(nmOf(l.it))}</b><br><small>${l.sh?'shared · your share ':''}${rm(l.amt)}</small></span>${l.sh?'':`<select data-ra="${l.i}" style="width:84px">${[1,2,3,4,5].map(q=>`<option value="${q}"${q==p?' selected':''}>${esc(nameOf(q)).slice(0,8)}</option>`).join('')}</select>`}<button class="t" data-rm="${l.i},${p}">✕</button></div>`).join('');
h+=has||R.force[p]?`<div class="bt" style="margin-top:8px"><button class="s t" data-gp="${p}">Preview PDF</button><button class="s t" data-gd="${p}">Download PDF</button></div><button data-gs="${p}" style="width:100%;margin-top:6px">Send Receipt: ${esc(nameOf(p))}</button>`:`<button class="s t" data-fo="${p}">Create empty request anyway</button>`;h+='</div>'}
h+=`<button data-ga="1" style="width:100%">Generate All Receipts</button><p class="m" style="margin:12px 0 4px">Saving records the full payment once. Each person you highlighted becomes a debt owed to you.</p><button id="sa" style="width:100%">Confirm and save to Aven</button>`;B.innerHTML=h;B.scrollTop=sc;R.note=null}
function recClick(e){const d=e.target.dataset,i=e.target.id;
if(i=='bk'){R.view='hl';panel()}
else if(d.ru){R.view='hl';R.warn=0;panel();const k=R.items.findIndex(it=>!Object.keys(partsOf(it)).length);if(k>=0)setTimeout(()=>focus(k),60)}
else if(d.ca){R.okSig=chk().ws;R.warn=0;recRender()}
else if(d.gp)act(+d.gp,'pv');else if(d.gd)act(+d.gd,'dl');else if(d.gs)act(+d.gs,'sh');else if(d.ga)genAll();
else if(d.fo){R.force[d.fo]=1;recRender()}else if(d.rm){const[k,p]=d.rm.split(',').map(Number);unassign(k,p)}else if(i=='sa')saveR()}
const finish=recRender;
function saveR(){if(R.saved)return;R.note=null;if(!gate())return recRender();const c=calc(),F=Math.round(c.F*100),me=Math.round(c.un.amt*100),oth=[];
for(let p=1;p<=5;p++){const a=Math.round(c.per[p].amt*100);if(c.per[p].lines.length&&a>0)oth.push({p,a})}
if(!(F>0)||!Number.isFinite(F)){note('The receipt total is missing. Type the total shown on the receipt.',1);return recRender()}
if(me+oth.reduce((a,o)=>a+o.a,0)!==F){note('The amounts do not add up to the receipt total, so nothing was saved.',1);return recRender()}
const key=[(R.store||'').toLowerCase(),R.rdate||'',R.no||'',F].join('|');
if(S.receipts.some(r=>!r.void&&r.key==key)&&!R.dupOk){R.dupOk=1;note('A receipt with the same shop, date, number and total is already saved. Tap Confirm again only if this is a different purchase.',1);return recRender()}
const mine=R.items.filter(it=>!Object.keys(partsOf(it)).length),sub=mine.reduce((a,b)=>a+Math.round(b.price*100),0),k=sub?me/sub:0;let ws=0,us=0;
mine.forEach(it=>{const v=Math.round(Math.round(it.price*100)*k);if(it.w=='w')ws+=v;else if(it.w=='u')us+=v});const ns=me-ws-us;
const ct=cat(R.store||'x')||CAT[2],rid=uid('rc'),tid=uid('t'),dids=[];
S.tx.push({id:tid,d:today(),t:'e',s:F,m:me,ws,ns,us,c:ct[0],n:'Receipt'+(R.store?' · '+R.store:''),w:'n',rid});
oth.forEach(o=>{const id=uid('d');dids.push(id);S.debts.push({id,who:nameOf(o.p),dir:'in',orig:o.a,reps:[],rid,tid,created:today()})});
S.receipts.push({id:rid,key,store:R.store||'',date:R.rdate||today(),no:R.no||'',total:F,created:today(),txId:tid,debtIds:dids,
items:R.items.map(it=>{const pr=partsOf(it),who={};Object.keys(pr).forEach(p=>who[nameOf(+p)]=Math.round(pr[p]*100));return{name:nmOf(it),q:it.q,unit:Math.round(it.u*100),line:Math.round(it.price*100),disc:Math.round((it.disc||0)*100),w:it.w,who:Object.keys(who).length?who:{Me:Math.round(it.price*100)}}})});
R.saved=1;sv();$('#scan').classList.remove('on');R=null;render();tab('debts')}

let LOGO=null;fetch('logo.png').then(r=>r.blob()).then(b=>{const f=new FileReader();f.onload=()=>LOGO=f.result;f.readAsDataURL(b)}).catch(()=>{});
function wmPdf(d){const n=d.getNumberOfPages(),H=842;for(let i=1;i<=n;i++){d.setPage(i);if(LOGO){try{d.addImage(LOGO,'PNG',24,H-26,14,14)}catch(e){}}d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(120,140,130);d.text('Processed with Aven',LOGO?42:24,H-16)}}
// ---- tutorial, nav, boot
const TUT={en:['1. Expenses → Camera: photograph a receipt (MR DIY, Giant, Lotus, 99 Speedmart, KK Mart, 7-Eleven).','2. Pinch or use + / − to zoom. Pick Person 1–5, then tap lines to highlight them in that person’s colour. Tap again to clear.','3. Tap ✎ to fix an amount. Qty × unit price is read for you; the line total is the number on the right.','4. Set Tax % if tax is not already in the prices. Type the receipt total to double-check the scan.','5. Tap Receipts. Anything you did not highlight counts as yours. Confirm and save: the full payment is recorded once, and each person you highlighted becomes a debt owed to you.','6. Needs vs Wants is guessed from item names. Tap the badge to change it.','7. Debts: tap “They paid me” when someone repays. Commitments: reserved money stays in your account until you tap Mark paid.'],
ms:['1. Belanja → Kamera: ambil gambar resit.','2. Zum guna + / −. Pilih Orang 1–5, kemudian tekan baris untuk tanda warna. Tekan lagi untuk padam.','3. Tekan ✎ untuk betulkan jumlah. Kuantiti × harga seunit dibaca automatik.','4. Letak Cukai % jika belum termasuk. Taip jumlah resit untuk semak imbasan.','5. Tekan Resit. Barang yang tidak ditanda dikira milik anda. Sahkan dan simpan: bayaran penuh direkod sekali, dan setiap orang yang ditanda menjadi hutang kepada anda.','6. Keperluan vs Kehendak diagak daripada nama barang. Tekan label untuk tukar.','7. Hutang: tekan “They paid me” apabila dibayar. Komitmen: wang tersimpan kekal dalam akaun sehingga anda tekan Mark paid.']};
function tut(){$('#tt').innerHTML=TUT[S.lang].map(x=>`<p>${x}</p>`).join('');$('#tut').classList.add('on')}$('#tutB').onclick=tut;$('#tx').onclick=()=>{$('#tut').classList.remove('on');S.seen=1;sv()};
function tab(n){$$('section').forEach(s=>s.classList.toggle('on',s.id==n));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.n==n));scrollTo(0,0)}
function render(){$$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('#nav').innerHTML=[['home','🏡'],['exp','🧾'],['debts','🤝'],['commit','📌'],['log','📒']].map(a=>`<button data-n="${a[0]}" class="${$('#'+a[0]).classList.contains('on')?'on':''}"><span>${a[1]}</span>${t(a[0])}</button>`).join('');home();logv();debtv();commv()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.n)};$('#lang').value=S.lang;$('#pd').value=S.payday||'';$('#lang').onchange=e=>{S.lang=e.target.value;sv();render()};
render();if(!S.seen)tut();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
