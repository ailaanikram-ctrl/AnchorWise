const sumI=()=>R.items.reduce((a,b)=>a+b.price,0);

function paint(i){const it=R.items[i],b=$('#pane').querySelector(`[data-i="${i}"]`),r=$('#r'+i);if(b)b.style.background=it.p?NEON[it.p-1]:'transparent';if(r){const d=r.querySelector('.dot');d.style.background=it.p?NEON[it.p-1]:'#ddd';d.textContent=it.p||'–'}chips()}

if(r){r.classList.add('foc');B.scrollTo({top:topIn(r,B)-B.clientHeight/2+r.offsetHeight/2,behavior:'smooth'})}}
function nextI(){const n=R.items.length;for(let k=1;k<=n;k++){const i=((R.foc??-1)+k)%n;if(!R.items[i].p)return i}return n?((R.foc??-1)+1)%n:-1}
function editAmt(i){const it=R.items[i],s=$('#pr'+i);s.innerHTML=`<input type="number" step="0.01" value="${it.price}" style="width:120px;padding:4px">`;const n=s.firstChild;let d=0;n.focus();const ok=()=>{if(d)return;d=1;const v=num(n.value);if(v>=0){it.price=v;it.u=v/it.q}panel()};n.onchange=ok;n.onblur=ok}
function panel(){const sc=$('#sbody').scrollTop,sm=sumI(),ent=num($('#en')?.value)||R._e||0,tx=num($('#tx2')?.value);R._e=ent;if(!isNaN(tx))R._t=tx;const T=R._t||0;
const tot=ent||R.total||sm*(1+T/100);
const okI=!R.total||Math.abs(sm-R.total)<.06||Math.abs(sm+R.tax-R.total)<.06,okE=!ent||!R.total||Math.abs(ent-R.total)<.06;
R.eff=tot;$('#sbody').innerHTML=`<div class="chips st">${NEON.map((c,i)=>`<button data-c="${i+1}" class="${CUR==i+1?'on':''}" style="background:${c}">${i+1}</button>`).join('')}</div>
<button id="hb" style="width:100%;margin:6px 0">🖍 Highlight</button><small>Highlight mode is on. Choose Person 1–5, then tap any item (or its line on the receipt). Tap again to clear.</small>
${R.items.length?'':'<p class="bad">No priced lines found. Retake the photo, flat and well lit.</p>'}
<div class="row" style="margin-top:8px"><span class="g">${t('tax')}</span><input id="tx2" type="number" step="0.1" value="${T}" style="width:90px" onchange="panel()"></div>
<div class="row"><span class="g">${t('ent')}</span><input id="en" type="number" step="0.01" value="${ent||''}" style="width:110px" onchange="panel()"></div>
<p class="${okI?'ok':'bad'}" style="margin:6px 0">${okI?'✓':'⚠'} Items ${rm(sm)} · Receipt ${R.total?rm(R.total):'?'}${R.tax?' · Tax '+rm(R.tax):''}</p>
${ent&&R.total?`<p class="${okE?'ok':'bad'}" style="margin:0 0 6px">${okE?'✓':'⚠'} Scanned ${rm(R.total)} vs typed ${rm(ent)}</p>`:''}
${R.items.map((it,i)=>`<div class="row it${R.foc===i?' foc':''}" id="r${i}" data-r="${i}"><span class="dot" style="background:${it.p?NEON[it.p-1]:'#ddd'}">${it.p||'–'}</span><span class="g nm"><b>${esc(nmOf(it))}</b><br><span id="pr${i}">${it.q>1?it.q+' × '+rm(it.u)+' = ':''}${rm(it.price)}</span></span><div class="acts"><button class="t" data-f="${i}">Highlight</button><button class="t" data-e="${i}">✎ RM</button><button class="t" data-n="${i}">${it.w=='w'?t('want'):t('need')}</button></div></div>`).join('')}
<button id="dn2" style="width:100%;margin-top:12px">${t('done')} · ${rm(tot)}</button>`;chips();$('#sbody').scrollTop=sc}
window.panel=panel;
$('#sbody').onclick=e=>{const d=e.target.dataset,cb=e.target.closest('[data-c]'),r=e.target.closest('[data-r]'),id=e.target.id;
if(cb){CUR=+cb.dataset.c;$$('[data-c]').forEach(b=>b.classList.toggle('on',+b.dataset.c==CUR))}
else if(d.f!=null)focus(+d.f);else if(d.e!=null)editAmt(+d.e);
else if(d.n!=null){const it=R.items[d.n];it.w=it.w=='w'?'n':'w';e.target.textContent=t(it.w=='w'?'want':'need')}
else if(id=='hb'){const i=nextI();if(i>=0)focus(i)}else if(id=='dn2')finish();else if(d.sh)share(+d.sh);else if(id=='sa')saveR();else if(id=='bk')panel();
else if(r&&e.target.tagName!='INPUT')assign(+r.dataset.r)};
function shares(){const T=R._t||0,o=[];for(let p=1;p<=5;p++){const its=R.items.filter(i=>i.p==p);if(its.length){const s=its.reduce((a,b)=>a+b.price,0);o.push({p,its,amt:+(s*(1+T/100)).toFixed(2)})}}return o}
function finish(){const sh=shares();if(!sh.length)return saveR();R.names=R.names||{};$('#sbody').innerHTML=`<h3>${t('split')}</h3>`+sh.map(s=>`<div class="row"><span class="dot" style="background:${NEON[s.p-1]}">${s.p}</span><input value="${esc(R.names[s.p]||'Person '+s.p)}" style="flex:1" onchange="R.names[${s.p}]=this.value"><b>${rm(s.amt)}</b><button class="t" data-sh="${s.p}">${t('share')}</button></div>`).join('')+`<button id="sa" style="width:100%;margin-top:12px">${t('saveA')}</button><button id="bk" class="s" style="width:100%;margin-top:8px">← Highlight</button>`}
function share(p){const s=shares().find(z=>z.p==p),nm=(R.names?.[p]||'Person'+p).replace(/[^\w-]+/g,'_'),W=R.cv.width,H=R.cv.height,L=W>H+120?'l':'p';
const d=new jspdf.jsPDF({unit:'px',format:[W,H+120],orientation:L,hotfixes:['px_scaling']});d.setFontSize(34);d.text(`${nm} - ${rm(s.amt)} - ${R.date}`,30,70);d.addImage(R.url,'JPEG',0,110,W,H);d.setGState(new d.GState({opacity:.5}));d.setFillColor(NEON[p-1]);
s.its.forEach(i=>d.roundedRect(i.x/100*W,110+i.y/100*H,i.wd/100*W,i.h/100*H,6,6,'F'));out(d.output('blob'),`${nm}-${s.amt.toFixed(2)}-${R.date}.pdf`,1)}
function saveR(){const T=R.eff||sumI(),sN=R.items.filter(i=>i.w!='w').reduce((a,b)=>a+b.price,0),sW=R.items.filter(i=>i.w=='w').reduce((a,b)=>a+b.price,0),s=sN+sW||1;
const c=(cat(R.store)||CAT[2]),n='Resit '+(R.store||'');[['n',sN],['w',sW]].forEach(([w,v])=>{const a=+(T*v/s).toFixed(2);if(a>0)addTx({t:'e',a,c:c[0],n:n+(w=='w'?' (kehendak)':''),w})});sv();$('#scan').classList.remove('on');R=null;render();tab('home')}
