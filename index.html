function sumHtml(p){const c=calc(),pp=c.per[p],ex=+(pp.amt-pp.sub).toFixed(2);return `<div class="card"><h3>${esc(nameOf(p))}</h3><small>${esc(R.store||'')} ${esc(R.rdate||R.date)} ${R.no?'· '+esc(R.no):''}</small>`+pp.lines.map(l=>`<div class="row"><span class="g"><b>${esc(nmOf(l.it))}</b><br><small>Qty ${l.it.q} · RM ${l.it.u.toFixed(2)} × ${l.it.q}${l.it.disc?' · discount −RM '+l.it.disc.toFixed(2):''}${l.sh?' · shared with '+(l.sh-1)+' other(s), your share only':''}</small></span><b>${rm(l.amt)}</b></div>`).join('')+(pp.lines.length?'':'<p class="m">No items assigned</p>')+`${Math.abs(ex)>=.01?`<div class="row"><span class="g">Share of tax / service / rounding</span><b>${rm(ex)}</b></div>`:''}<div style="background:var(--g);color:#f6f1e3;border-radius:14px;padding:12px;margin-top:8px;display:flex;justify-content:space-between;font-weight:bold"><span>TOTAL AMOUNT TO PAY BACK</span><span>${rm(pp.amt)}</span></div></div>`}
async function previewR(p){await getPdf(p);R.pv=p;$('#pvt').textContent=nameOf(p)+' · '+rm(calc().per[p].amt);$('#pvb').innerHTML=sumHtml(p)+`<h3>Original receipt</h3><img src="${R.url}" style="width:100%"><h3>Highlighted receipt (${esc(nameOf(p))} only)</h3><img src="${hlCanvas(p).toDataURL('image/jpeg',.8)}" style="width:100%">`;$('#pvw').classList.add('on')}
$('#pvc').onclick=()=>$('#pvw').classList.remove('on');
$('#pvd').onclick=async()=>{try{dl(await getPdf(R.pv));note('Downloaded.')}catch(e){note('PDF failed: '+e.message,1)}recRender()};
$('#pvs').onclick=async()=>{if(!gate()){$('#pvw').classList.remove('on');return recRender()}try{await sendR(R.pv)}catch(e){note('PDF failed: '+e.message,1)}recRender()};
async function act(p,m){R.note=null;if(!gate())return recRender();try{if(m=='pv')await previewR(p);else if(m=='dl'){dl(await getPdf(p));note('Downloaded '+R.pdfs[p].name)}else await sendR(p)}catch(e){note('PDF failed: '+e.message,1)}recRender()}
async function genAll(){R.note=null;if(!gate())return recRender();let n=0;try{for(let p=1;p<=5;p++)if(calc().per[p].lines.length||R.force[p]){await getPdf(p);n++}note(n?`Generated ${n} PDF${n>1?'s':''}. Download or send each one below.`:'No one has assigned items yet.',!n)}catch(e){note('PDF failed: '+e.message,1)}recRender()}
function unassign(k,p){const it=R.items[k];if(it.sp){it.sp=it.sp.filter(x=>x!=p);if(it.sp.length==1){it.p=it.sp[0];it.sp=null}else if(it.sp.length){it.md='eq';it.cv={}}else it.sp=null}else if(it.p==p)it.p=0;recRender()}
function recRender(){R.view='rec';const B=$('#sbody'),sc=B.scrollTop,k=chk(),c=k.c,asg=[1,2,3,4,5].reduce((a,p)=>a+c.per[p].amt,0),okSum=Math.abs(c.F-asg-c.un.amt)<.005;
let h=`<button id="bk" class="s" style="width:100%">← Highlight</button>${R.note?`<p class="${R.note.bad?'bad':'ok'}">${esc(R.note.msg)}</p>`:''}`;
if(R.warn)h+=`<div class="card" style="border-color:var(--warn)"><b class="bad">${k.unI?'Some receipt items have not been assigned to any person. Please review them before generating the final PDFs.':'Items and tax do not match the receipt total (difference '+rm(k.ex)+'). Please review before generating the final PDFs.'}</b><div class="bt" style="margin-top:8px">${k.unI?'<button data-ru="1">Review unassigned</button>':''}<button class="s" data-ca="1">Continue anyway</button></div></div>`;
h+=`<div class="card" style="margin-top:8px"><h3>Check</h3><div class="row"><span class="g">Assigned to people</span><b>${rm(asg)}</b></div><div class="row"><span class="g">Unassigned (${k.unI} item${k.unI==1?'':'s'})</span><b class="${c.un.amt?'bad':''}">${rm(c.un.amt)}</b></div><div class="row"><span class="g">Receipt total</span><b>${rm(c.F)}</b></div>
<p class="${okSum?'ok':'bad'}" style="margin:6px 0 0">${okSum?'✓':'⚠'} ${rm(asg)} + ${rm(c.un.amt)} = ${rm(c.F)}</p><p class="${Math.abs(k.ex)>.1?'bad':'ok'}" style="margin:0">${Math.abs(k.ex)>.1?'⚠':'✓'} Difference still to resolve: ${rm(k.ex)}</p>${k.unI?'<button class="s t" data-ru="1" style="margin-top:6px">Review unassigned</button>':''}</div>`;
for(let p=1;p<=5;p++){const pp=c.per[p],has=pp.lines.length>0,o=R.pdfs[p],st=!o?'Not generated':o.sig==sig(p)?'PDF ready ✓':'Outdated · will regenerate';
h+=`<div class="card"><div class="row" style="border:0"><span class="dot" style="background:${NEON[p-1]}">${p}</span><input data-nm="${p}" value="${esc(nameOf(p))}" style="flex:1"></div>`;
h+=has||R.force[p]?`<p style="margin:0">Amount to Pay Back: <b style="font-size:22px;color:var(--g)">${rm(pp.amt)}</b></p><small>${st}</small>`:`<p class="m" style="margin:0">No items assigned</p>`;
h+=pp.lines.map(l=>`<div class="row"><span class="g"><b>${esc(nmOf(l.it))}</b><br><small>${l.sh?'shared · your share ':''}${rm(l.amt)}</small></span>${l.sh?'':`<select data-ra="${l.i}" style="width:84px">${[1,2,3,4,5].map(q=>`<option value="${q}"${q==p?' selected':''}>${esc(nameOf(q)).slice(0,8)}</option>`).join('')}</select>`}<button class="t" data-rm="${l.i},${p}">✕</button></div>`).join('');
h+=has||R.force[p]?`<div class="bt" style="margin-top:8px"><button class="s t" data-gp="${p}">Preview PDF</button><button class="s t" data-gd="${p}">Download PDF</button></div><button data-gs="${p}" style="width:100%;margin-top:6px">Send Receipt: ${esc(nameOf(p))}</button>`:`<button class="s t" data-fo="${p}">Create empty request anyway</button>`;h+='</div>'}
h+=`<button data-ga="1" style="width:100%">Generate All Receipts</button><button id="sa" class="s" style="width:100%;margin-top:8px">${t('saveA')}</button>`;B.innerHTML=h;B.scrollTop=sc;R.note=null}
function recClick(e){const d=e.target.dataset,i=e.target.id;
if(i=='bk'){R.view='hl';panel()}
else if(d.ru){R.view='hl';R.warn=0;panel();const k=R.items.findIndex(it=>!Object.keys(partsOf(it)).length);if(k>=0)setTimeout(()=>focus(k),60)}
else if(d.ca){R.okSig=chk().ws;R.warn=0;recRender()}
else if(d.gp)act(+d.gp,'pv');else if(d.gd)act(+d.gd,'dl');else if(d.gs)act(+d.gs,'sh');else if(d.ga)genAll();
else if(d.fo){R.force[d.fo]=1;recRender()}else if(d.rm){const[k,p]=d.rm.split(',').map(Number);unassign(k,p)}else if(i=='sa')saveR()}
const finish=recRender;
function saveR(){const T=R.eff||sumI(),sN=R.items.filter(i=>i.w!='w').reduce((a,b)=>a+b.price,0),sW=R.items.filter(i=>i.w=='w').reduce((a,b)=>a+b.price,0),s=sN+sW||1;
const c=(cat(R.store)||CAT[2]),n='Resit '+(R.store||'');[['n',sN],['w',sW]].forEach(([w,v])=>{const a=+(T*v/s).toFixed(2);if(a>0)addTx({t:'e',a,c:c[0],n:n+(w=='w'?' (kehendak)':''),w})});sv();$('#scan').classList.remove('on');R=null;render();tab('home')}
