function advice(ex,inc){

  '<label>Who or what is it?<textarea id="ds" placeholder="e.g. WhatsApp seller selling iPhone RM800, wants transfer to personal account">'+esc(pre.d||"")+'</textarea></label>'+
  FLAGS.map(function(f,k){return '<label class="chk"><input type="checkbox" class="fl" data-w="'+f[1]+'" id="f'+k+'"><span>'+f[0]+'</span></label>'}).join("")+
  '<button class="btn w" id="go">Check risk</button></div><div id="res"></div>'+
  '<div class="card"><h2>Verify before you pay</h2><p class="mu" style="margin-top:0">Check the account or phone number on the Royal Malaysia Police <a href="https://semakmule.rmp.gov.my" target="_blank" rel="noopener">Semak Mule</a>. Check licences on Bank Negara’s Financial Consumer Alert List and the Securities Commission’s Investor Alert List. Check companies on SSM. If you already paid, call your bank right away and the National Scam Response Centre at 997.</p></div>'}
function scan(){
  var l=$("ds").value.toLowerCase();
  FK.forEach(function(k){if(k[0].test(l))$("f"+k[1]).checked=true})}
function risk(){
  var sc=0,mx=0,rs=[];
  [].forEach.call(document.querySelectorAll(".fl:checked"),function(c){var w=+c.dataset.w;sc+=w;mx=Math.max(mx,w);rs.push(c.nextSibling.textContent)});
  var lv=mx>=3||sc>=5?"bad":sc>=2?"warn":"tip";
  var t={bad:["High risk. Do not pay or share any code.","Stop contact. Never give TAC/OTP or install files sent in chat. Verify through the official website or number you find yourself, and check Semak Mule. If you already paid, call your bank and 997 now."],warn:["Be careful.","Several warning signs. Ask for company details, pay only through the platform’s protected checkout or COD, and check Semak Mule before transferring."],tip:["No major red flags ticked.","Still verify the seller’s reviews, use protected payment, and keep chat records."]}[lv];
  $("res").innerHTML='<div class="tip '+(lv==="tip"?"":lv)+'"><b>'+t[0]+'</b><br>'+t[1]+(rs.length?'<ul style="margin:8px 0 0;padding-left:18px">'+rs.map(function(r){return "<li>"+esc(r)+"</li>"}).join("")+"</ul>":"")+'</div>'}
function hist(){
  var all=S.tx.slice().sort(function(a,b){return a.date===b.date?(+a.id)-(+b.id):a.date<b.date?-1:1});
  var bal=+S.open||0,start=ym+"-01";
  all.forEach(function(t){if(t.date<start)bal+=(t.type==="inc"?t.amt:-t.amt)});
  var bf=bal,dr=0,cr=0,out=[],tr="";
  all.filter(function(t){return t.date.slice(0,7)===ym}).forEach(function(t){
    bal+=t.type==="inc"?t.amt:-t.amt;if(t.type==="inc")cr+=t.amt;else dr+=t.amt;
    var ds=t.purpose||t.payee||short(t.cat),n=function(v){return rm(v).slice(3)};
    out.push([t.date,ds,t.type==="exp"?t.amt:"",t.type==="inc"?t.amt:"",bal,t.cat,S.names[t.who]||"",t.raw||t.note||""]);
    tr+='<tr data-s="'+esc((ds+" "+t.cat+" "+(t.raw||"")+" "+(t.ch||"")).toLowerCase())+'"><td>'+t.date.slice(8)+"/"+t.date.slice(5,7)+'</td><td><b>'+esc(ds)+'</b>'+(t.cat==="Other"?'<span class="chip">Check category</span>':'')+'<div class="mu">'+esc(short(t.cat))+' · '+esc(S.names[t.who]||"")+(t.ch?' · '+esc(t.ch):'')+'</div>'+(t.raw?'<div class="mu" style="font-size:12px">“'+esc(t.raw.slice(0,90))+'”</div>':'')+''+(t.rc?'<button class="lnk" data-rc="'+t.id+'">Receipt</button> ':'')+'<button class="lnk" data-ed="'+t.id+'">Edit</button> <button class="lnk" data-del="'+t.id+'">Delete</button></td><td class="n neg">'+(t.type==="exp"?n(t.amt):"")+'</td><td class="n pos">'+(t.type==="inc"?n(t.amt):"")+'</td><td class="n">'+n(bal)+'</td></tr>'});
  rows=out;var n2=function(v){return rm(v).slice(3)};
  return '<div class="top"><h1>Record</h1><div><button class="lnk" id="mp">‹</button> <b>'+mlabel()+'</b> <button class="lnk" id="mn">›</button></div></div>'+
  '<div class="card"><div class="row"><div><div class="mu">Closing balance</div><div class="big '+(bal<0?'neg':'')+'">'+rm(bal)+'</div></div><button class="btn g" id="ob">Starting balance</button></div></div>'+
  '<input id="fq" placeholder="Search description, category or message" aria-label="Search the record" style="margin-bottom:12px">'+
  '<div class="card"><div class="wrap"><table class="tbl"><thead><tr><th>Date</th><th>Description</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance (RM)</th></tr></thead><tbody>'+
  '<tr class="sum"><td></td><td>Balance brought forward</td><td></td><td></td><td class="n">'+n2(bf)+'</td></tr>'+
  (tr||'<tr><td></td><td class="mu">No entries this month.</td><td></td><td></td><td></td></tr>')+
  '<tr class="sum"><td></td><td>Total and closing balance</td><td class="n">'+n2(dr)+'</td><td class="n">'+n2(cr)+'</td><td class="n">'+n2(bal)+'</td></tr></tbody></table></div></div>'+
  '<div class="seg" style="grid-template-columns:1fr 1fr"><button data-cs="0" aria-pressed="'+!csvAll+'">This month</button><button data-cs="1" aria-pressed="'+csvAll+'">All records</button></div><div style="display:flex;gap:10px"><button class="btn" id="csvs" style="flex:1">Save CSV</button><button class="btn g" id="csvh" style="flex:1">Send CSV</button></div><p class="mu" id="cm"></p>'}
function render(){
  var v={home:home,add:add,check:check,hist:hist,debt:debts}[view]();
  $("app").innerHTML=v;
  var IC={"home": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"/>", "add": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8v8M8 12h8\"/>", "check": "<path d=\"M12 3a6 6 0 0 0-3 11v3h6v-3a6 6 0 0 0-3-11z\"/><path d=\"M10 20h4\"/>", "hist": "<path d=\"M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01\"/>", "debt": "<path d=\"M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\"/><path d=\"M3 7l12-3v3\"/>"};$("nav").innerHTML=[["home","Dashboard"],["add","Add"],["check","Advice"],["hist","Record"],["debt","Debts"]].map(function(n){return '<button data-v="'+n[0]+'"'+(view===n[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n[0]]+'</svg>'+n[1]+'</button>'}).join("");
  var q=function(i,f){var e=$(i);if(e)e.onclick=f};
  q("mp",function(){shift(-1)});q("mn",function(){shift(1)});
  q("rn",function(){var a=prompt("Name 1",S.names[0]),b=prompt("Name 2",S.names[1]);if(a&&b){S.names=[a.trim(),b.trim()];save();render()}});
  q("qb",runIngest);
  if($("qa"))$("qa").addEventListener("paste",function(){setTimeout(runIngest,80)});
  q("un",function(){if(done){var ids=done.items.map(function(p){return p.id});S.tx=S.tx.filter(function(y){return ids.indexOf(y.id)<0});save()}done=null;render()});
  q("gl",function(){done=null;view="hist";render()});
  q("sv",function(){
    var a=parseFloat($("am").value);if(!(a>0)){$("er").textContent="Enter an amount above 0.";return}
    if(kind==="debt"){var w=$("py").value.trim();if(!w){$("er").textContent="Enter who you borrowed from.";return}
      S.debts.unshift({id:String(Date.now()),who:w,amt:a,date:$("dt").value||iso(new Date()),due:$("du").value||"",note:$("nt").value.trim()});
      if(!save()){S.debts.shift();$("er").textContent="Could not save on this device.";return}
      kind="exp";view="debt";render();return}
    var pe=$("py").value.trim(),ct=$("ct").value,tx0={id:String(Date.now()),type:kind,amt:a,cat:ct,who:+$("wh").value,payee:pe,purpose:mkp(ct,pe,kind==="inc",pe),raw:$("nt").value.trim(),note:"",date:$("dt").value};applyDebt(tx0);S.tx.unshift(tx0);cleanup();
    if(!save()){S.tx.shift();$("er").textContent="Could not save on this device.";return}
    ym=$("dt").value.slice(0,7);view="home";render()});
  q("go",risk);q("ask",ask);q("inst",function(){if(!inst)return;inst.prompt();inst.userChoice.then(function(){inst=null;render()})});
  if($("ds"))$("ds").oninput=scan;
  q("csvs",function(){var f=csvFile();try{saveFile(f.name,f.text);$("cm").textContent="Saved "+f.name+" to your downloads."}catch(e){$("cm").textContent="Couldn’t save the file on this device."}});
  q("csvh",function(){sendFile(csvFile(),function(m){$("cm").textContent=m})});
  q("rcb",function(){$("rcam").click()});q("rpb",function(){$("rpick").click()});
  ["rcam","rpick"].forEach(function(i){var el=$(i);if(el)el.onchange=function(){handleReceipt(this.files&&this.files[0])}});
  q("rcx",function(){scan=null;render()});q("rsv",saveReceipt);
  q("ob",function(){var v=prompt("Balance in your account before you started using this app (RM)",S.open||0);if(v===null)return;var n=parseFloat(String(v).replace(/,/g,""));if(!isNaN(n)){S.open=n;save();render()}});
  if($("fq"))$("fq").oninput=function(){var v=this.value.toLowerCase();[].forEach.call(document.querySelectorAll("tr[data-s]"),function(r){r.classList.toggle("hide",r.dataset.s.indexOf(v)<0)})};
  q("ps",function(){var n=Date.now(),mx="";pend.forEach(function(p,i){p.id=String(n+i);delete p.review;if(p.date>mx)mx=p.date;S.tx.unshift(p)});pend=[];save();ym=mx.slice(0,7);view="hist";render()});
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-v],[data-k],[data-del],[data-chk],[data-ed],[data-pr],[data-keep],[data-dadd],[data-dpay],[data-ddel],[data-am],[data-cs],[data-rc]");if(!t)return;if(t.dataset.pr!==undefined){pend.splice(+t.dataset.pr,1);render();return}if(t.dataset.ed){editTx(t.dataset.ed);return}
  if(t.dataset.am){amode=t.dataset.am;if(kind==="debt")kind="exp";pre={};scan=null;render();return}
  if(t.dataset.cs){csvAll=t.dataset.cs==="1";render();return}
  if(t.dataset.rc){rcGet(t.dataset.rc,function(v){$("ed").innerHTML='<h2>Receipt</h2>'+(v?'<img src="'+v+'" alt="Receipt photo" style="width:100%;border-radius:12px;margin-bottom:12px">':'<p class="mu">The photo isn’t on this device any more.</p>')+'<div style="text-align:right"><button class="btn g" id="rcc">Close</button></div>';$("ed").showModal();$("rcc").onclick=function(){$("ed").close()}});return}
  if(t.dataset.dadd){kind="debt";view="add";pre={};render();return}
  if(t.dataset.dpay){var pp=dpeople().filter(function(x){return x.key===t.dataset.dpay})[0];kind="exp";pre={cat:"Debt repayment (borrowed money)",py:pp?pp.name:""};view="add";render();return}
  if(t.dataset.ddel){if(confirm("Delete this debt from the list? Expenses already in Record stay.")){S.debts=S.debts.filter(function(x){return dk(x.who)!==t.dataset.ddel});S.tx.forEach(function(x){if(x.debtKey===t.dataset.ddel){delete x.debtKey;delete x.debtApplied}});save();render()}return}if(t.dataset.keep){var kx=S.tx.filter(function(y){return y.id===t.dataset.keep})[0];if(kx){kx.keep=true;save();render()}return}
  if(t.dataset.v){view=t.dataset.v;pre={};done=null;scan=null;render()}
  else if(t.dataset.k){kind=t.dataset.k;amode="manual";render()}
  else if(t.dataset.del){if(confirm("Delete this entry?")){S.tx=S.tx.filter(function(x){return x.id!==t.dataset.del});rcDel(t.dataset.del);save();render()}}
  else if(t.dataset.chk){var x=S.tx.filter(function(y){return y.id===t.dataset.chk})[0];pre={d:(x.raw||x.purpose||x.payee||"")+" "+rm(x.amt)};view="check";render();scan()}
});
var inst=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();inst=e;if(view==="home")render()});
window.addEventListener("appinstalled",function(){inst=null;if(view==="home")render()});
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
load();cleanup();render();
})();
</script>
