  '<tr class="sum"><td></td><td>Balance brought forward</td><td></td><td></td><td class="n">'+n2(bf)+'</td></tr>'+
  (tr||'<tr><td></td><td class="mu">No entries this month.</td><td></td><td></td><td></td></tr>')+
  '<tr class="sum"><td></td><td>Total and closing balance</td><td class="n">'+n2(dr)+'</td><td class="n">'+n2(cr)+'</td><td class="n">'+n2(bal)+'</td></tr></tbody></table></div></div>'+
  '<button class="btn g w" id="cp">Copy record as CSV</button><p class="mu" id="cm"></p>'}
function render(){
  var v={home:home,add:add,check:check,hist:hist}[view]();
  $("app").innerHTML=v;
  $("nav").innerHTML=[["home","Dashboard"],["add","Add"],["check","Advice"],["hist","Record"]].map(function(n){return '<button data-v="'+n[0]+'"'+(view===n[0]?' aria-current="page"':'')+'>'+n[1]+'</button>'}).join("");
  var q=function(i,f){var e=$(i);if(e)e.onclick=f};
  q("mp",function(){shift(-1)});q("mn",function(){shift(1)});
  q("rn",function(){var a=prompt("Name 1",S.names[0]),b=prompt("Name 2",S.names[1]);if(a&&b){S.names=[a.trim(),b.trim()];save();render()}});
  q("qb",runIngest);
  if($("qa"))$("qa").addEventListener("paste",function(){setTimeout(runIngest,80)});
  q("un",function(){if(done){var ids=done.items.map(function(p){return p.id});S.tx=S.tx.filter(function(y){return ids.indexOf(y.id)<0});save()}done=null;render()});
  q("gl",function(){done=null;view="hist";render()});
  q("sv",function(){
    var a=parseFloat($("am").value);if(!(a>0)){$("er").textContent="Enter an amount above 0.";return}
    var pe=$("py").value.trim(),ct=$("ct").value;S.tx.unshift({id:String(Date.now()),type:kind,amt:a,cat:ct,who:+$("wh").value,payee:pe,purpose:mkp(ct,pe,kind==="inc",pe),raw:$("nt").value.trim(),note:"",date:$("dt").value});
    if(!save()){S.tx.shift();$("er").textContent="Could not save on this device.";return}
    ym=$("dt").value.slice(0,7);view="home";render()});
  q("go",risk);q("ask",ask);q("inst",function(){if(!inst)return;inst.prompt();inst.userChoice.then(function(){inst=null;render()})});
  if($("ds"))$("ds").oninput=scan;
  q("cp",function(){var cv=function(v){return '"'+String(v).replace(/"/g,'""')+'"'};var csv="date,description,debit,credit,balance,category,person,message\n"+rows.map(function(r){return [r[0],cv(r[1]),r[2],r[3],r[4].toFixed(2),cv(r[5]),cv(r[6]),cv(r[7])].join(",")}).join("\n");copy(csv,function(ok){$("cm").textContent=ok?"Copied. Paste it into a spreadsheet.":"Copy didn’t work on this device."})});
  q("ob",function(){var v=prompt("Balance in your account before you started using this app (RM)",S.open||0);if(v===null)return;var n=parseFloat(String(v).replace(/,/g,""));if(!isNaN(n)){S.open=n;save();render()}});
  if($("fq"))$("fq").oninput=function(){var v=this.value.toLowerCase();[].forEach.call(document.querySelectorAll("tr[data-s]"),function(r){r.classList.toggle("hide",r.dataset.s.indexOf(v)<0)})};
  q("ps",function(){var n=Date.now(),mx="";pend.forEach(function(p,i){p.id=String(n+i);delete p.review;if(p.date>mx)mx=p.date;S.tx.unshift(p)});pend=[];save();ym=mx.slice(0,7);view="hist";render()});
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-v],[data-k],[data-del],[data-chk],[data-ed],[data-pr],[data-keep]");if(!t)return;if(t.dataset.pr!==undefined){pend.splice(+t.dataset.pr,1);render();return}if(t.dataset.ed){editTx(t.dataset.ed);return}if(t.dataset.keep){var kx=S.tx.filter(function(y){return y.id===t.dataset.keep})[0];if(kx){kx.keep=true;save();render()}return}
  if(t.dataset.v){view=t.dataset.v;pre={};done=null;render()}
  else if(t.dataset.k){kind=t.dataset.k;render()}
  else if(t.dataset.del){if(confirm("Delete this entry?")){S.tx=S.tx.filter(function(x){return x.id!==t.dataset.del});save();render()}}
  else if(t.dataset.chk){var x=S.tx.filter(function(y){return y.id===t.dataset.chk})[0];pre={d:(x.raw||x.purpose||x.payee||"")+" "+rm(x.amt)};view="check";render();scan()}
});
var inst=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();inst=e;if(view==="home")render()});
window.addEventListener("appinstalled",function(){inst=null;if(view==="home")render()});
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
load();render();
})();
</script>
</body>
